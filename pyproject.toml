[project]
name = "stockfih"
version = "0.1.0"
description = "Desktop chess app with a custom engine and an unjustifiably high ego"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.12.0",
    "python-chess>=1.11.2",
]

[project.scripts]
stockfih = "stockfih.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Third-party noise from python-chess on Python 3.14. Everything else still shows.
    "ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning",
]
